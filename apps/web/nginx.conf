server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The API ships without CORS headers on purpose: the browser only ever talks to this
  # origin, and nginx forwards /api to the API service inside the compose network.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
